    <style>
      :root {
        --ink: #111111;
        --paper: #ffffff;
        --surface: #f5f5f7;
        --border: #e5e5e5;
        --muted: #666666;
        --accent: #2563eb;
        --accent-strong: #1d4ed8;
        --accent-soft: #eff6ff;
        --accent-border: #bfdbfe;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #ededed;
          --paper: #0e0e11;
          --surface: #17171c;
          --border: #2a2a33;
          --muted: #a1a1ad;
          --accent: #60a5fa;
          --accent-strong: #93c5fd;
          --accent-soft: #14203a;
          --accent-border: #1e3a5f;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { width: 100%; max-width: 560px; text-align: center; }
      .code {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 999px;
        background: var(--accent-soft);
        border: 1px solid var(--accent-border);
        color: var(--accent-strong);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin-bottom: 22px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: clamp(26px, 6vw, 34px);
        line-height: 1.3;
        letter-spacing: -0.01em;
      }
      .en { margin: 0 0 20px; font-size: 15px; color: var(--muted); font-weight: 500; }
      p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 26px 0 0; }
      a.btn {
        display: inline-block;
        padding: 11px 22px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 0.15s ease;
      }
      a.btn:hover { transform: translateY(-1px); }
      a.primary { background: var(--accent); color: #ffffff; }
      a.secondary { border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
      .divider { height: 1px; background: var(--border); margin: 26px 0 20px; }
      .small { font-size: 13px; color: var(--muted); }
      .small a { color: var(--accent-strong); }
      :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <span class="code">404</span>
      <h1>页面未找到</h1>

      <p lang="en">The page you are looking for may have been moved, renamed, or never existed.</p>
      <div class="actions">

        <a class="btn secondary" href="/zh/">中文首页</a>
      </div>
      <div class="divider"></div>
      <p class="small">
        Aixuno 视频去水印 — 免费在线去除自有视频水印 ·
        <a href="/guides/">去水印教程</a>
      </p>
    </main>
  </body>
</html>
